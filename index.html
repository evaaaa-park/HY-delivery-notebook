<title>헬리오 배달수첩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, one scrolling view, fixed bottom tabs, bottom sheets for edits. Wide screens center a 1080px column. */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --sunk:#E7EBF2; --ink:#121823; --muted:#596377; --line:#D9DFE8;
  --accent:#2F54EB; --accent-ink:#FFFFFF; --accent-soft:#E4EAFF;
  --ok:#1C8248; --ok-soft:#DFF2E6; --warn:#9E5E00; --warn-soft:#FFEFD2; --bad:#C2362C; --bad-soft:#FCE5E2;
  --plate:#EBEFF5; --plate-ink:#1B2433; --fredit:#7A3FCF; --blk0:#2F54EB; --blk1:#0E8C86;
  --shadow:0 1px 2px rgba(18,24,35,.06),0 6px 18px rgba(18,24,35,.07);
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-app-theme="light"]){
  --bg:#0E121A; --surface:#161B25; --sunk:#1D2330; --ink:#E7EBF3; --muted:#97A1B4; --line:#2A3241;
  --accent:#819BFF; --accent-ink:#0A0F1F; --accent-soft:#1E2847;
  --ok:#52C483; --ok-soft:#143021; --warn:#F2B24C; --warn-soft:#33260E; --bad:#FF7D71; --bad-soft:#3A1917;
  --plate:#222A38; --plate-ink:#E2E8F2; --fredit:#B48CFF; --blk0:#819BFF; --blk1:#3CC7BE; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]:not([data-app-theme="light"]),:root[data-app-theme="dark"]{
  --bg:#0E121A; --surface:#161B25; --sunk:#1D2330; --ink:#E7EBF3; --muted:#97A1B4; --line:#2A3241;
  --accent:#819BFF; --accent-ink:#0A0F1F; --accent-soft:#1E2847;
  --ok:#52C483; --ok-soft:#143021; --warn:#F2B24C; --warn-soft:#33260E; --bad:#FF7D71; --bad-soft:#3A1917;
  --plate:#222A38; --plate-ink:#E2E8F2; --fredit:#B48CFF; --blk0:#819BFF; --blk1:#3CC7BE; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.brand{white-space:nowrap;font-family:var(--f-display);font-size:23px;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:0;margin-top:4px}
.top .sp{flex:1}
.sync{font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 9px;border:1px solid var(--line);border-radius:99px;background:var(--surface);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.db i{background:var(--ok)} .sync.saving i{background:var(--warn)} .sync.local i{background:var(--warn)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

main{padding-block:16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.nav .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;line-height:17px;font-weight:700}
.fab{position:fixed;z-index:24;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px 0 16px;border-radius:26px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.fab svg{width:22px;height:22px}
.fab[hidden]{display:none}

/* common */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sec{display:grid;gap:12px;margin-bottom:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-family:var(--f-display);font-size:21px;font-weight:400}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap;line-height:1.5}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge.t-adhoc{background:var(--accent-soft);color:var(--accent)}
.badge.t-sample{background:var(--warn-soft);color:var(--warn)}
.badge.t-fredit{background:color-mix(in srgb,#8A4FD8 16%,var(--surface));color:color-mix(in srgb,#8A4FD8 80%,var(--ink))}
.badge.t-prepaid{background:color-mix(in srgb,#0E8C86 16%,var(--surface));color:color-mix(in srgb,#0E8C86 80%,var(--ink))}
.badge.t-pickup{background:var(--bad-soft);color:var(--bad)}
.plate{display:inline-flex;align-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;background:var(--plate);color:var(--plate-ink);border:1px solid var(--line);border-radius:5px;padding:1px 6px;letter-spacing:.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.plate i{font-style:normal;color:var(--muted);margin:0 2px}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:hsl(var(--h,210) 60% 50%);flex:none}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty h3{color:var(--ink);font-size:16px}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=tel],select,textarea{width:100%;min-height:44px;padding:8px 11px;font-size:16px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
textarea{min-height:76px;resize:vertical}
.lbl{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
.field{display:grid;gap:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 8px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex:none}
.stepper button{width:32px;height:30px;border:0;background:none;font-size:18px;line-height:1;color:var(--ink)}
.stepper b{min-width:24px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.daypick{display:flex;gap:4px}
.daypick button{width:32px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.daypick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* home */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.hello h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1}
.alerts{display:grid;gap:8px}
.todo{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.todo .t{flex:1;min-width:0} .todo .t b{font-weight:600;display:block} .todo .t small{color:var(--muted);font-size:12.5px}
.todo-add{display:flex;gap:8px;padding:10px 14px} .todo-add input{flex:1;min-width:0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn)}
.alert.info{border-left-color:var(--accent)}
.alert.bad{border-left-color:var(--bad)}
.alert.ok{border-left-color:var(--ok)}
.alert .t{flex:1;min-width:0}
.alert .t b{font-weight:600}
.alert .t small{display:block;color:var(--muted);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{padding:14px;display:grid;gap:6px;align-content:start}
.kpi .big{font-family:var(--f-display);font-size:34px;line-height:1}
.kpi .big small{font-size:17px;color:var(--muted);margin-left:2px}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.recent{display:grid}
.recent .it{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.recent .it:first-child{border-top:0}
.recent .it .t{flex:1;min-width:0}
.recent .it .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* customers */
.ctool{display:grid;gap:10px;margin-bottom:12px}
.ctool .srch{display:flex;gap:8px}
.ctool .srch input{flex:1;min-width:0}
.clist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.ccard{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.ccard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ccard .pick{display:grid;place-items:start center;padding:14px 4px 0 12px;cursor:pointer}
.ccard .pick input{width:20px;height:20px;accent-color:var(--accent)}
.cbody{flex:1;min-width:0;padding:11px 12px 11px 8px;display:grid;gap:7px}
.chead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cname{border:0;background:none;padding:0;font-weight:700;font-size:16px;text-align:left}
.cloc{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.ritems{display:grid;gap:5px;grid-template-columns:minmax(0,1fr)}
.cbody>*{min-width:0}
.ritem{display:flex;align-items:center;gap:7px;font-size:14px}
.ritem .pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .dd{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.ritem.zero .pn{color:var(--muted);text-decoration:line-through}
.cmeta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cnote{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:7px;padding:5px 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.ccard.paused{background:color-mix(in srgb,var(--warn-soft) 45%,var(--surface))}
.ccard.inactive{opacity:.55}
.bulkbar{position:fixed;left:0;right:0;z-index:26;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg)}
.bulkbar .wrap{display:flex;align-items:center;gap:10px;padding-block:9px}
.bulkbar .n{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.bulkbar .acts{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.bulkbar .acts::-webkit-scrollbar{display:none}
.bulkbar button{flex:none;border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);background:transparent;color:var(--bg);border-radius:8px;padding:6px 11px;font-size:13.5px;font-weight:600;white-space:nowrap}
.bulkbar button.x{border:0;padding:6px 8px}

/* order sheet (T-2) */
.ohead{display:grid;gap:10px;margin-bottom:12px}
.datenav{display:flex;align-items:center;gap:8px}
.datenav .d{flex:1;text-align:center;font-family:var(--f-display);font-size:24px;line-height:1.1}
.datenav .d small{display:block;font-family:var(--f-body);font-size:12.5px;color:var(--muted);margin-top:3px}
.tblwrap{overflow-x:auto}
table.ot{width:100%;border-collapse:collapse;font-size:14px}
.ot th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ot th:first-child{text-align:left}
.ot td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
.ot td:first-child{text-align:left}
.ot tr.prow{cursor:pointer}
.ot .pname{display:flex;gap:7px;align-items:center;min-width:0}
.ot .pname small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.ot .buy{font-family:var(--f-display);font-size:22px;color:var(--accent);line-height:1}
.ot .buy.zero{color:var(--muted)}
.ot input{width:68px;min-height:40px;text-align:right;padding:4px 8px;font-variant-numeric:tabular-nums}
.ot tr.cat td{background:var(--sunk);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:6px 8px;text-align:left}
.ot tr.detail td{background:var(--sunk);text-align:left;padding:8px 12px}
.ot tfoot td{font-weight:700;border-bottom:0}
.diff{font-size:12px;font-weight:700;margin-left:4px}
.diff.up{color:var(--bad)} .diff.dn{color:var(--ok)}
.brk{display:grid;gap:4px;font-size:13px}
.brk div{display:flex;gap:8px;align-items:center}
.brk div span:nth-child(2){flex:1;min-width:0}

/* route */
.rhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:15;background:var(--bg);padding-block:4px 10px;display:grid;gap:10px;margin-bottom:6px}
.prog{display:flex;align-items:center;gap:10px;font-size:13.5px}
.prog .bar{flex:1}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.rrow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 8px 9px 4px;margin-top:8px;touch-action:pan-y;position:relative}
.rrow.newb{margin-top:26px}
.rrow.newb::before{content:attr(data-b);position:absolute;left:4px;top:-21px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.rrow.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.rrow.done{background:transparent}
.rrow.done .rinfo{opacity:.5}
.rrow.done .rname{text-decoration:line-through}
.rrow.dragging{box-shadow:var(--shadow);border-color:var(--accent);z-index:5;opacity:.96}
.handle{width:30px;align-self:stretch;border:0;background:none;color:var(--muted);touch-action:none;cursor:grab;display:grid;place-items:center;flex:none}
.handle svg{width:16px;height:16px}
.seq{min-width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-family:var(--f-mono);font-weight:600;font-size:13px;flex:none}
.rinfo{flex:1;min-width:0;display:grid;gap:4px}
.rtop{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rname{font-weight:700}
.rits{display:flex;gap:5px;flex-wrap:wrap}
.it-chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:2px 8px 2px 6px;border-radius:6px;background:var(--sunk);white-space:nowrap}
.it-chip b{font-family:var(--f-mono);font-weight:600}
.it-chip.adhoc{background:var(--accent-soft)} .it-chip.sample{background:var(--warn-soft)} .it-chip.fredit{background:color-mix(in srgb,#8A4FD8 16%,var(--surface))}
.rflags{display:flex;gap:5px;flex-wrap:wrap}
.rnote{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.check{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:transparent}
.check svg{width:22px;height:22px}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.mapsec{display:grid;gap:8px;margin-bottom:16px}
.mapsec h3{font-size:13px;color:var(--muted);letter-spacing:.04em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 4px;display:grid;gap:2px;justify-items:center;min-height:58px}
.tile .bn{font-family:var(--f-mono);font-weight:600;font-size:14px}
.tile .cnt{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.none{opacity:.45;background:transparent}
.tile.pend{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.tile.pend .cnt{color:var(--accent);font-weight:600}
.tile.full{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.tile.full .cnt{color:var(--ok);font-weight:600}
.tile[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.fplan{padding:12px;display:grid;gap:12px}
.ents{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ent h4{margin:0 0 6px;font-size:12.5px;color:var(--muted)}
.floors{display:grid;gap:4px}
.fl{display:grid;grid-template-columns:34px repeat(var(--cols),minmax(0,1fr));gap:4px;align-items:stretch}
.fl .fn{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:grid;place-items:center}
.cell{border:1px dashed var(--line);border-radius:7px;min-height:40px;font-size:12px;padding:3px 5px;display:grid;align-content:center;text-align:left;background:transparent;min-width:0}

    const r = d[p.id] || { ...Object.fromEntries(TYPES.map(t => [t, 0])), rows: [] };
    const need = TYPES.reduce((s, t) => s + (P[t] ? r[t] : 0), 0);
    const stock = Math.max(0, +(S.config.stock[p.id] || 0));
    return { p, r, need, stock, buy: Math.max(0, need - stock), excl: TYPES.reduce((s, t) => s + (!P[t] ? r[t] : 0), 0) };
  });
  // products that appear in orders but are no longer in the catalog
  for (const pid of Object.keys(d)) if (!prodById(pid)) { const r = d[pid]; const need = TYPES.reduce((s, t) => s + (P[t] ? r[t] : 0), 0); rows.push({ p: { id: pid, name: pid, short: pid, orderName: pid, hue: 0 }, r, need, stock: 0, buy: need, excl: 0 }); }
  return rows;
}
function confirmDiff(date, rows) {
  const conf = S.days[date]?.confirmed; if (!conf) return null;
  const out = []; const seen = new Set();
  for (const r of rows) { seen.add(r.p.id); const c = +conf[r.p.id] || 0; if (r.buy !== c) out.push({ id: r.p.id, name: r.p.name, d: r.buy - c }); }
  for (const pid of Object.keys(conf)) if (!seen.has(pid) && +conf[pid]) out.push({ id: pid, name: pName(pid), d: -conf[pid] });
  return out;
}

/* ================= alerts ================= */
function buildAlerts() {
  const t = TODAY(); const out = [];
  for (const c of S.customers) {
    if (c.status !== 'active' && c.endDate) { const de = daysBetween(t, c.endDate); if (de >= 0 && de <= 3) out.push({ kind: 'info', html: `<b>${esc(c.name)}</b> ${fmt(c.endDate)}부터 ${STATUS_NAME[c.status]}`, sub: `${esc(locShort(c.loc))}${c.statusNote ? ' · ' + esc(c.statusNote) : ''} · 전날까지 배달해요` }); }
    if (!isOn(c, t)) continue;
    for (const p of c.pauses) {
      if (p.ack) continue;
      const resume = nextDeliveryDay(p.to);
      const dd = daysBetween(t, resume);
      if (dd >= -2 && dd <= 3) out.push({ kind: 'ok', html: `<b>${esc(c.name)}</b> 배달 재개 ${fmt(resume)}`, sub: `${fmtShort(p.from)}–${fmtShort(p.to)} 중지 끝 · 동선과 발주표에 자동으로 다시 들어가요`, act: `<button class="btn sm" data-act="ackPause" data-id="${c.id}" data-p="${p.id}">확인</button>` });
      const ds = daysBetween(t, p.from);
      if (ds >= 0 && ds <= 2) out.push({ kind: 'info', html: `<b>${esc(c.name)}</b> ${fmt(p.from)}부터 배달 중지${pauseDays(p)}`, sub: `${fmtShort(p.from)}–${fmtShort(p.to)}${p.reason ? ' · ' + esc(p.reason) : ''}` });
    }
  }
  const tgt = orderTarget();
  for (let d = t; d <= tgt; d = addDays(d, 1)) {
    const diff = confirmDiff(d, sheetFor(d));
    if (diff && diff.length) {
      const txt = diff.map(x => `${esc(x.name)} ${x.d > 0 ? '+' : ''}${x.d}`).join(', ');
      out.push({ kind: 'bad', html: `<b>${fmt(d)} 발주 확정 후 바뀜</b>`, sub: txt + (d < tgt ? ' · 이미 발주한 날짜라 재고나 지점 추가 요청이 필요해요' : ''), act: `<button class="btn sm" data-act="gotoOrder" data-date="${d}">보기</button>` });
    }
  }
  const dd = routeDefaultDate();
  for (const d of [dd, nextDeliveryDay(dd)]) {
    const n = S.orders.filter(o => o.date === d && o.type === 'sample' && o.status === 'open');
    if (n.length) out.push({ kind: 'info', html: `<b>지점에서 견본 받아오기</b> ${fmt(d)} 배달분 ${n.length}건`, sub: n.map(o => o.items.map(i => `${pShort(i.productId)}×${i.qty}`).join(' ')).join(' / ') });
  }
  for (const d of [...new Set([dd, orderTarget()])]) {
    if (isHoliday(d)) out.push({ kind: 'info', html: `<b>${fmt(d)} ${esc(holidayName(d))}</b>`, sub: '정기 배달 없음' });
    else if (isPartHol(d)) { const off = S.customers.filter(c => c.holidayOff && isOn(c, d)); out.push({ kind: 'info', html: `<b>${fmt(d)} ${esc(holidayName(d))}</b> · 공휴일`, sub: `아파트는 배달 · ${off.map(c => c.name).join(', ') || '쉬는 곳 없음'} 쉼` }); }
  }
  const unpaid = S.customers.filter(c => inCollection(c) && c.payment === 'cash' && c.paidMonth !== MONTH());
  if (unpaid.length) out.push({ kind: 'warn', html: `<b>현금 수금 남은 고객 ${unpaid.length}명</b>`, sub: unpaid.slice(0, 6).map(c => esc(c.name)).join(', ') + (unpaid.length > 6 ? ' 외' : ''), act: `<button class="btn sm" data-act="filterCash">보기</button>` });
  return out;
}

  b.pauses.filter(p => !pa.has(p.id)).forEach(p => out.push({ kind: '중지', from: p.from, to: p.to, text: `배달 중지${pauseDays(p)}${p.reason ? ' · ' + p.reason : ''}` }));
  const pb = new Set(b.pauses.map(p => p.id));
  a.pauses.filter(p => !pb.has(p.id)).forEach(p => out.push({ kind: '중지', from: p.from, to: p.to, text: `중지 취소${pauseDays(p)}` }));
  if ((a.notes || '') !== (b.notes || '')) out.push({ kind: '메모', from: '', to: '', text: `메모: ${b.notes || '(지움)'}` });
  const info = [];
  if (a.name !== b.name) info.push(`이름 ${a.name} → ${b.name}`);
  if (a.phone !== b.phone) info.push(`연락처 ${b.phone}`);
  if (locShort(a.loc) !== locShort(b.loc) || a.loc.label !== b.loc.label) info.push(`위치 ${locShort(b.loc)} ${b.loc.label || ''}`.trim());
  if (a.payment !== b.payment) info.push(`수금 ${PAY[b.payment]}`);
  if (info.length) out.push({ kind: '고객 정보', from: '', to: '', text: info.join(' · ') });
  return out;
}

/* ================= performance (실적) ================= */
const TY_CODE = { regular: 'r', adhoc: 'a', sample: 's', fredit: 'f', prepaid: 'p', pickup: 'k' };
const CODE_TY = { r: 'regular', a: 'adhoc', s: 'sample', f: 'fredit', p: 'prepaid', k: 'pickup' };
function liveDay(date) {
  return stopsFor(date).filter(s => !s.skipped).map(s => ({ key: s.key, name: s.name, loc: locShort(s.loc), items: s.items.filter(i => i.type !== 'pickup').map(i => ({ pid: i.pid, qty: i.qty, ty: i.type })) })).filter(e => e.items.length);
}
function encodeDay(date) {
  const day = { s: {}, n: {}, at: Date.now() };
  liveDay(date).forEach(e => {
    const agg = new Map(); e.items.forEach(i => { const k = i.pid + '*' + TY_CODE[i.ty]; agg.set(k, (agg.get(k) || 0) + i.qty); });
    day.s[e.key] = [...agg].map(([k, q]) => { const [p, t] = k.split('*'); return `${p}*${q}*${t}`; }).join(';');
    if (e.key.startsWith('o:')) day.n[e.key] = `${e.name}|${e.loc}`;
  });
  if (daysBetween(date, ymd(new Date())) > 1) day.e = 1; // frozen after the fact: estimated from the list at that time
  if (S.days[date]) { const info = doneInfo(date); day.dt = info.dt; day.cat = info.at; }
  return day;
}
function decodeDay(day) {
  return Object.entries(day.s || {}).map(([key, str]) => {
    const c = key.startsWith('o:') ? null : custById(key);
    const nn = (day.n && day.n[key] || '').split('|');
    return { key, name: c ? c.name : (nn[0] || '주문'), loc: c ? locShort(c.loc) : (nn[1] || ''), items: str ? str.split(';').map(x => { const [pid, q, t] = x.split('*'); return { pid, qty: +q, ty: CODE_TY[t] || 'regular' }; }) : [] };
  });
}
// past delivery days get a fixed copy so later changes do not rewrite what was delivered
function maybeFreeze() {
  if (store.mode === 'loading') return;
  if (store.db && !DOCS.every(n => store.loaded[n])) return;
  if (!S.customers.length) return;
  const t = TODAY();
  if (!S.perf.since) S.perf.since = t.slice(0, 8) + '01';
  let changed = false;
  for (let d = S.perf.since; d < t; d = addDays(d, 1)) {
    if (S.perf.days[d]) { if (S.perf.days[d].dt === undefined && S.days[d] && stampDone(d)) changed = true; continue; }
    if (!isDeliveryDay(d) && !S.orders.some(o => o.date === d && o.status === 'open')) continue;
    S.perf.days[d] = encodeDay(d); changed = true;
  }
  // days finished before completion records existed: stamp the time of the last check
  let logged = false;
  Object.keys(S.days).filter(d => d < t && S.days[d].done && !S.days[d].completedAt).forEach(d => {
    const st = dayStatus(d); if (!st.n || st.d !== st.n) return;
    const last = Math.max(...Object.values(S.days[d].done)); S.days[d].completedAt = last;
    S.log = S.log.filter(e => e.merge !== 'done:' + d);
    const e = { id: uid('l_'), at: last, cid: null, name: '하루 배달', loc: '', from: d, to: d, kind: '배달 완료', text: `${st.n}곳 모두 완료 · 제품 ${st.qty}개${st.orders ? ` · 주문 있는 곳 ${st.orders}` : ''} · ${hm(last)}`, by: '직접', merge: 'done:' + d };
    S.log.push(e); S.log.sort((x, y) => y.at - x.at); stampDone(d); logged = true;
  });
  if (logged) save('days', 'log', 'perf');
  if (changed) save('perf');
}
function refreshPerfKey(date, key) {
  const day = S.perf.days[date]; if (!day) return false;
  const fresh = encodeDay(date);
  if (fresh.s[key] != null) { day.s[key] = fresh.s[key]; if (fresh.n[key]) day.n[key] = fresh.n[key]; } else delete day.s[key];
  return true;
}
// 지난 날짜의 휴무일을 넣거나 빼면 그날 실적도 다시 맞춰요
function holPerf(d) {
  if (!d || d >= TODAY() || !S.perf.days[d]) return;
  const f = encodeDay(d); const day = S.perf.days[d];
  if (isHoliday(d)) { day.s = f.s; day.n = f.n; }
  else S.customers.filter(c => c.holidayOff).forEach(c => refreshPerfKey(d, c.id));
  save('perf');
}
function refreshPerfFrom(key, from) {
  if (!from || from >= TODAY()) return false; let any = false;
  Object.keys(S.perf.days).forEach(d => { if (d >= from && refreshPerfKey(d, key)) any = true; });
  return any;
}
function perfData(month, withFuture) {
  const [y, m] = month.split('-').map(Number); const n = new Date(y, m, 0).getDate();
  const t = TODAY(); const res = new Map();
  for (let d = 1; d <= n; d++) {
    const date = `${month}-${pad(d)}`;
    let entries, est = false;
    if (S.perf.days[date]) { entries = decodeDay(S.perf.days[date]); est = !!S.perf.days[date].e; }
    else if (date <= t || withFuture) { if (!isDeliveryDay(date) && !S.orders.some(o => o.date === date && o.status === 'open')) continue; entries = liveDay(date); est = date > t ? 'plan' : false; }
    else continue;
    entries.forEach(e => {
      let r = res.get(e.key);
      if (!r) { r = { key: e.key, name: e.name, loc: e.loc, prod: {}, dates: [], total: 0 }; res.set(e.key, r); }
      e.items.forEach(i => { r.prod[i.pid] = (r.prod[i.pid] || 0) + i.qty; r.total += i.qty; });
      r.dates.push({ date, items: e.items, est });
    });
  }
  return res;
}
function perfOrder(list) {
  const idx = new Map((S.config.baseSeq || []).map((k, i) => [k, i]));
  return list.sort((a, b) => (idx.has(a.key) ? idx.get(a.key) : 9999) - (idx.has(b.key) ? idx.get(b.key) : 9999) || a.loc.localeCompare(b.loc));
}

- 사용자가 변경·주문·중지·해지 같은 걸 말하면 도구로 바로 반영하고, 무엇을 바꿨는지 한두 줄로 알려 줘. 앱에서 되돌리기 버튼을 줄 거야.
- "그날만/이번만/하루만"은 set_day_items 또는 skip_day. "앞으로/매주/계속"은 set_regular.
- 기간 동안 쉬는 건 add_pause(끝나면 자동 재개). 해지·이사·중단은 set_status(명단에서 지우지 않아).
- 지난 날짜에 대한 요청(미전달, 그날 바꿔 드림 등)도 해당 날짜로 반영하고, 데이터에 넣을 게 없으면 add_log로 기록만 남겨.
- 바꾸는 도구는 자동으로 변경 기록이 남으니 add_log를 또 부르지 마.
- 고객이 애매하면 바꾸기 전에 물어봐. 동-호(예: 411-1501)로 찾아.
- 질문에는 get_ 도구로 확인하고 답해. 모르는 건 지어내지 마.
- 주문 종류는 hy 앱 주문구분대로 나눠: 후불정기=고객 정기(regular), (선불)정기=prepaid, 일반=fredit, 견본=sample(0원, 지점에서 받아옴), hy 앱에 없는 포스트잇·전화 주문=adhoc, 반품·회수=pickup. 결제금액 0원이면 견본이야. 택배는 배달 대상이 아니야.
- 매번 오는 (선불)정기 고객은 add_customer/update_customer로 payment=prepaid 고객으로 만들고 정기 품목으로 넣어.
- 정기 외 주문(일반·선불정기·견본·추가)은 자동 발주나 지점 수령이라 발주표에 안 들어가. 회수는 발주·실적 모두 제외.

/* ================= daily completion record ================= */
const isDelivered = o => { const c = o.customerId ? custById(o.customerId) : null; return !!S.days[o.date]?.done?.[c ? c.id : 'o:' + o.id]; };
const hm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
// completion summary + per-stop check times, kept with the day's saved 실적 (lives ~100 days)
function doneInfo(date) {
  const done = S.days[date]?.done || {};
  const keys = Object.keys(done);
  const dt = {}; keys.forEach(k => { const d = new Date(done[k]); dt[k] = d.getHours() * 60 + d.getMinutes(); });
  return { dt, at: S.days[date]?.completedAt || 0 };
}
function stampDone(date) {
  const day = S.perf.days[date]; if (!day || !S.days[date]) return false;
  const info = doneInfo(date); const was = stable({ dt: day.dt || {}, at: day.cat || 0 });
  day.dt = info.dt; day.cat = info.at;
  return was !== stable({ dt: day.dt, at: day.cat });
}
function dayStatus(date) {
  const frozen = S.perf.days[date];
  const entries = frozen ? decodeDay(frozen) : liveDay(date);
  const doneMap = S.days[date]?.done;
  const isDone = k => doneMap ? !!doneMap[k] : !!(frozen?.dt && frozen.dt[k] != null);
  const timeOf = k => doneMap && doneMap[k] ? hm(doneMap[k]) : (frozen?.dt && frozen.dt[k] != null ? `${pad(Math.floor(frozen.dt[k] / 60))}:${pad(frozen.dt[k] % 60)}` : '');
  const n = entries.length, d = entries.filter(e => isDone(e.key)).length;
  const qty = entries.reduce((s, e) => s + e.items.reduce((a, i) => a + i.qty, 0), 0);
  const orders = entries.filter(e => e.items.some(i => !isSched(i.ty))).length;
  const at = S.days[date]?.completedAt || frozen?.cat || 0;
  const times = entries.map(e => timeOf(e.key)).filter(Boolean).sort();
  return { entries, n, d, qty, orders, at, isDone, timeOf, first: times[0] || '', last: times[times.length - 1] || '' };
}

  aiBack: () => { const back = AI?.back; closeSheet(); if (back) { openOrderSheet({}); F = back; renderOF(); } },
  // customer sheet
  cfAddReg: () => { readCF(); CF.regular.push({ productId: S.config.products[0]?.id, qty: 1, days: [1, 2, 3, 4, 5] }); renderCF(); },
  cfDelReg: a => { readCF(); CF.regular.splice(+a.dataset.i, 1); renderCF(); },
  cfDay: a => { readCF(); const r = CF.regular[+a.dataset.i]; const d = +a.dataset.d; r.days = r.days.includes(d) ? r.days.filter(x => x !== d) : [...r.days, d].sort(); renderCF(); },
  cfQty: a => { readCF(); const r = CF.regular[+a.dataset.i]; r.qty = Math.max(0, r.qty + (+a.dataset.d)); renderCF(); },
  cfAddPause: () => { const f = $('#cfPF').value, t = $('#cfPT').value; if (!f || !t || t < f) { toast('중지 기간을 확인해 주세요.'); return; } const r = $('#cfPR').value.trim(); const pd = $$('#cfPD button').map((b, i) => b.getAttribute('aria-pressed') === 'true' ? i + 1 : 0).filter(Boolean); readCF(); CF.pauses.push({ id: uid('p_'), from: f, to: t, reason: r, ack: false, days: pd }); renderCF(); },
  cfDelPause: a => { readCF(); CF.pauses = CF.pauses.filter(p => p.id !== a.dataset.p); renderCF(); },
  cfSave: () => saveCF(),
  cfDelete: () => { const id = CF.id, nm = CF.name; confirmSheet(`${nm} 완전 삭제`, '명단·실적에서 사라지고 앞으로 남은 주문도 지워져요. 해지나 이사는 “계약 상태”로 바꾸면 기록이 남아요.', '완전 삭제', () => { const bc = clone(S.customers), bo = clone(S.orders); S.customers = S.customers.filter(c => c.id !== id); S.orders = S.orders.filter(o => !(o.customerId === id && o.date >= TODAY())); UI.selected.delete(id); save('customers', 'orders'); render(); toast(`${nm} 삭제했어요`, () => { S.customers = bc.map(normCust); S.orders = bo.map(normOrder); save('customers', 'orders'); render(); }); }); },
  // settings
  leadMode: a => { S.config.leadMode = a.dataset.m; save('config'); render(); },
  floorDir: a => { S.config.floorDir = a.dataset.m; save('config'); render(); },
  delivDay: a => { const d = +a.dataset.d; const L = S.config.deliveryDays; S.config.deliveryDays = L.includes(d) ? L.filter(x => x !== d) : [...L, d].sort(); save('config'); render(); },
  addHoliday: () => { const d = $('#hDate').value; if (!d) { toast('날짜를 골라 주세요.'); return; } S.config.holidays = S.config.holidays.filter(h => h.date !== d); const mode = $('#hMode')?.value === 'full' ? 'full' : 'partial'; S.config.holidays.push({ date: d, name: $('#hName').value.trim() || (mode === 'full' ? '휴무' : '공휴일'), mode }); save('config'); holPerf(d); render(); toast(mode === 'full' ? `${fmt(d)} 전체 휴무: 정기 배달과 발주에서 빠져요` : `${fmt(d)} 공휴일: 상가·주민센터·미화/관리만 빠져요`); },
  delHoliday: a => { S.config.holidays = S.config.holidays.filter(h => h.date !== a.dataset.date); save('config'); holPerf(a.dataset.date); render(); },
  rMove: a => { const i = +a.dataset.i, d = +a.dataset.d, L = S.config.routeOrder; const j = i + d; if (j < 0 || j >= L.length) return; [L[i], L[j]] = [L[j], L[i]]; save('config'); render(); },
  rDel: a => { S.config.routeOrder.splice(+a.dataset.i, 1); save('config'); render(); },
  rAdd: () => { const v = $('#rNew').value.trim().replace(/동$/, ''); if (!v) return; if (!S.config.routeOrder.includes(v)) S.config.routeOrder.push(v); save('config'); render(); },
  clearBase: () => { S.config.baseSeq = null; save('config'); render(); toast('기본 동선을 지웠어요. 동 순서대로 자동 정렬돼요.'); },
  addProd: () => { S.config.products.push({ id: uid('p_'), name: '새 제품', short: '새 제품', orderName: '새 제품', cat: '기타(Fredit 등)', hue: Math.floor(Math.random() * 360) }); save('config'); render(); },
  delProd: a => {
    const p = S.config.products[+a.dataset.i]; if (!p) return;
    const used = S.customers.some(c => c.regular.some(r => r.productId === p.id)) || S.orders.some(o => o.status === 'open' && o.date >= TODAY() && o.items.some(i => i.productId === p.id));
    if (used) { toast(`${p.name}은(는) 고객이나 주문에 쓰이고 있어서 지울 수 없어요.`); return; }
    S.config.products.splice(+a.dataset.i, 1); save('config'); render();
  },
  backup: async () => {
    if (!downloadsNs) return;
    try { await downloadsNs.save({ filename: `헬리오배달수첩-${TODAY()}.json`, data: JSON.stringify(S, null, 1) }); }
    catch (e) { if (e?.code !== 'declined') toast('백업 파일을 저장하지 못했어요.'); }
  },
  clearExamples: () => confirmSheet('예시 데이터 지우기', '“예시” 표시가 있는 고객과 주문만 지워요. 직접 넣은 데이터는 그대로예요.', '지우기', () => {
    const ex = new Set(S.customers.filter(c => c.tags.includes('예시')).map(c => c.id));
    S.customers = S.customers.filter(c => !ex.has(c.id)); S.orders = S.orders.filter(o => !o.tags.includes('예시') && !ex.has(o.customerId));
    S.config.baseSeq = null; S.days = {}; UI.selected.clear(); save('customers', 'orders', 'config', 'days'); render(); toast('예시 데이터를 지웠어요');
  }),
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = ACT[a.dataset.act]; if (!fn) return;
  if (a.tagName === 'A') e.preventDefault();
  fn(a, e);
});
const CHG = {
  pick: el => { el.checked ? UI.selected.add(el.dataset.id) : UI.selected.delete(el.dataset.id); el.closest('.ccard')?.classList.toggle('sel', el.checked); renderBulk(); $('#fab').hidden = UI.selected.size > 0; const all = $('#selAll'); if (all) { const vis = filteredCustomers().map(c => c.id); all.checked = vis.every(id => UI.selected.has(id)); all.indeterminate = !all.checked && vis.some(id => UI.selected.has(id)); } },
  selAll: el => { const vis = filteredCustomers().map(c => c.id); vis.forEach(id => el.checked ? UI.selected.add(id) : UI.selected.delete(id)); render(); },
  stock: el => { const v = Math.max(0, Math.round(+el.value || 0)); if (v) S.config.stock[el.dataset.id] = v; else delete S.config.stock[el.dataset.id]; save('config'); updateOrderNumbers(); },
  ofdate: el => { if (el.value) { F.date = el.value; renderOF(); } },
  cfProd: el => { readCF(); CF.regular[+el.dataset.i].productId = el.value; renderCF(); },
  cfEvery: el => { readCF(); const r = CF.regular[+el.dataset.i]; r.every = el.checked ? 2 : 1; if (el.checked && !r.anchor) { let x = TODAY(); for (let k = 0; k < 14 && !r.days.includes(dow(x)); k++) x = addDays(x, 1); r.anchor = x; } renderCF(); },
  cfAnchor: el => { if (CF) CF.regular[+el.dataset.i].anchor = el.value; },
  leadDays: el => { S.config.leadDays = Math.max(0, Math.min(7, Math.round(+el.value || 0))); save('config'); render(); },
  purchase: el => { S.config.purchase[el.dataset.k] = el.checked; save('config'); render(); },
  prod: el => { const p = S.config.products[+el.dataset.i]; if (!p) return; p[el.dataset.f] = el.value.trim() || p[el.dataset.f]; save('config'); },
  aiPic: el => { AI_PICS = [...(el.files || [])]; const n = $('#aiPicN'); if (n) n.textContent = AI_PICS.length ? `사진 ${AI_PICS.length}장 첨부` : ''; },
  aiFiles: el => { const n = el.files?.length || 0; const f = $('#aiFn'); if (f) f.textContent = n ? `사진 ${n}장` : ''; },
  restore: el => {
    const file = el.files?.[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const o = JSON.parse(rd.result); if (!o || !Array.isArray(o.customers)) throw new Error('bad');
        confirmSheet('백업 불러오기', `고객 ${o.customers.length}명, 주문 ${(o.orders || []).length}건으로 지금 데이터를 바꿔요.`, '불러오기', () => {
          S.customers = o.customers.map(normCust); S.orders = (o.orders || []).map(normOrder); S.config = normConfig(o.config); S.days = o.days || {};
          save(...DOCS); render(); toast('백업을 불러왔어요');
        }, false);
      } catch (e) { toast('이 파일은 헬리오 배달수첩 백업이 아니에요.'); }
    };
    rd.readAsText(file); el.value = '';
  },
};
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el); });
const INP = {
  custq: el => { UI.custQ = el.value; renderCustList(); },
  ofq: el => { F.q = el.value; renderOFRes(); },
  ofnote: el => { F.note = el.value; },
  sfONote: el => { if (SF) SF.orders[+el.dataset.o].note = el.value; },
  logq: el => { UI.logQ = el.value; renderLogList(); },
  perfq: el => { UI.perfQ = el.value; const keep = el.selectionStart; render(); const n = $('#perfq'); if (n) { n.focus(); try { n.setSelectionRange(keep, keep); } catch (e) { } } },
  ofnl: el => { F.nl[el.dataset.f] = el.value; const i = $('#ofimp'); if (i) i.innerHTML = ofImpact(); },
};
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (UI.selected.size) { UI.selected.clear(); render(); } return; }
  if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
  if (e.target.closest('input,textarea,select,[contenteditable]') || !$('#sheet').hidden) return;
  const tabs = { '1': 'home', '2': 'customers', '3': 'order', '4': 'route', '5': 'records' };
  if (tabs[e.key]) { e.preventDefault(); ACT.tab({ dataset: { tab: tabs[e.key] } }); }
  else if (e.key === 'n' || e.key === 'N' || e.key === 'ㅜ') { e.preventDefault(); ACT.newOrder(); }
  else if (e.key === '/') { e.preventDefault(); if (UI.tab !== 'customers') ACT.tab({ dataset: { tab: 'customers' } }); $('#custq')?.focus(); }
});
mqSplit.addEventListener?.('change', () => render());
let rsT = null; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(setRheadH, 120); });
// stock inputs: update numbers in place while typing across rows, full render when focus leaves the table
function updateOrderNumbers() {
  const rows = sheetFor(UI.orderDate || orderTarget());
  rows.forEach(r => { const el = document.querySelector(`[data-buy="${CSS.escape(r.p.id)}"]`); if (el) { el.textContent = r.buy; el.classList.toggle('zero', !r.buy); } });
  const show = rows.filter(r => r.need || r.excl || r.stock);
  const tb = $('#totBuy'); if (tb) tb.textContent = show.reduce((s, r) => s + r.buy, 0);
  const ts = $('#totStock'); if (ts) ts.textContent = show.reduce((s, r) => s + r.stock, 0);
}
document.addEventListener('focusout', e => { if (e.target.matches && e.target.matches('.ot input')) setTimeout(() => { if (!document.activeElement || !document.activeElement.matches('.ot input')) render(); }, 0); });

/* ================= boot ================= */
applyTheme(getTheme());
loadLocal();
if (ensureRouteOrder()) cacheLocal();
render();
initRuntime();
// roll the date over if the page stays open past midnight
let lastDay = TODAY();
setInterval(() => { if (TODAY() !== lastDay) { lastDay = TODAY(); UI.routeDate = null; UI.orderDate = null; maybeFreeze(); render(); } }, 60000);
setTimeout(() => { if (store.mode !== 'db') maybeFreeze(); }, 2500);
// leaving the app (home button, app switch, closing the tab): keep the local copy and push pending edits right away
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { cacheLocal(); flushNow(); return; }
  flushPending();
  if (store.db) DOCS.forEach(n => { if (!store.live[n]) subscribe(n); });
  if (TODAY() !== lastDay) { lastDay = TODAY(); UI.routeDate = null; UI.orderDate = null; }
  maybeFreeze();
  render();
});
window.addEventListener('pagehide', () => { cacheLocal(); flushNow(); });
window.addEventListener('online', () => { store.fails = 0; flushPending(); renderSync(); });
window.addEventListener('offline', renderSync);
</script>
